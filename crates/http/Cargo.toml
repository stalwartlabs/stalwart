[package]
name = "http"
version = "1.0.1"
edition = "2024"

[dependencies]
store = { path = "../store" }
common = { path =  "../common" }
utils = { path =  "../utils" }
trc = { path = "../trc" }
telemetry = { path = "../telemetry" }
email = { path = "../email" }
smtp = { path = "../smtp" }
jmap = { path = "../jmap" }
dav = { path = "../dav" }
scim = { path = "../scim" }
groupware = { path = "../groupware" }
http_proto = { path = "../http-proto" }
jmap_proto = { path = "../jmap-proto" }
types = { path = "../types" }
directory = { path =  "../directory" }
services = { path =  "../services" }
registry = { path =  "../registry" }
mail-parser = { version = "1.0", features = ["full_encoding"] } 
mail-builder = { version = "2.0" }
mail-auth = { version = "0.14", features = ["generate", "arc"] }
tokio = { version = "1.54", features = ["rt"] }
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
async-stream = "0.3.6"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
encodify = "1.0"
sha2 = "0.11"
rkyv.workspace = true
form-data = { version = "0.6.0", features = ["sync"], default-features = false }
mime = "0.3.17"
percent-encoding = "2.3.2"
hashify = { version = "0.3" }
compact_str = "0.10.0"

[dev-dependencies]
flate2 = "1.1"
jmap-tools = { path = "../jmap-tools" }

[features]
dev_mode = []
enterprise = ["scim/enterprise", "store/enterprise", "common/enterprise", "utils/enterprise", "trc/enterprise", "email/enterprise", "smtp/enterprise", "jmap/enterprise", "dav/enterprise", "groupware/enterprise", "http_proto/enterprise", "jmap_proto/enterprise", "directory/enterprise", "services/enterprise", "registry/enterprise"]

[lints]
workspace = true
