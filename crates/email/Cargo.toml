[package]
name = "email"
version = "1.0.1"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
nlp = { path = "../nlp" }
store = { path = "../store" }
trc = { path = "../trc" }
types = { path = "../types" }
jmap_proto = { path = "../jmap-proto" }
jmap-tools = { path = "../jmap-tools" }
common = { path =  "../common" }
groupware = { path =  "../groupware" }
registry = { path =  "../registry" }
text-extract = { path = "../text-extract" }
mail-parser = { version = "1.0", features = ["full_encoding"] } 
mail-builder = { version = "2.0" }
encodify = "1.0"
sieve-rs = { path = "../sieve" }
tokio = { version = "1.54", features = ["net", "macros"] }
aes = "0.9"
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11"
cbc = { version = "0.2", features = ["alloc"] }
rasn = "0.29"
rasn-cms = "0.29"
rasn-pkix = "0.29"
rsa = { version = "0.9.10", features = ["sha2"] }
rand = "0.8"
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
hashify = "0.3"
rkyv.workspace = true
compact_str = "0.10.0"
tinyvec = { version = "1.13.3", features = ["alloc"] }
bytecount = "0.6"

[features]
enterprise = ["utils/enterprise", "store/enterprise", "trc/enterprise", "jmap_proto/enterprise", "common/enterprise", "groupware/enterprise", "registry/enterprise"]

[dev-dependencies]
tokio = { version = "1.54", features = ["full"] }
serde_json = "1.0"

[lints]
workspace = true
