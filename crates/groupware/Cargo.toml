[package]
name = "groupware"
version = "1.0.1"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
store = { path = "../store" }
common = { path =  "../common" }
types = { path = "../types" }
trc = { path = "../trc" }
nlp = { path = "../nlp" }
registry = { path = "../registry" }
calcard = { path = "../calcard", features = ["rkyv"] }
jmap-tools = { path = "../jmap-tools" }
hashify = "0.3"
text-extract = { path = "../text-extract" }
tokio = { version = "1.54", features = ["net", "macros"] }
rkyv.workspace = true
percent-encoding = "2.3.2"
compact_str = "0.10.0"
ahash = { version = "0.8" }
indexmap = "2.14.2"
jiff = "0.2.38"
icu_locale_core = "2"
icu_provider = { version = "2", features = ["sync"] }
icu_plurals = "2"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
icu_datetime = { version = "~2.4", features = ["unstable_jiff_0_2"] }

[features]
enterprise = ["utils/enterprise", "store/enterprise", "common/enterprise", "trc/enterprise", "registry/enterprise"]

[dev-dependencies]

[lints]
workspace = true
