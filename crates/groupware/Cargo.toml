[package]
name = "groupware"
version = "0.16.20"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
store = { path = "../store" }
common = { path =  "../common" }
types = { path = "../types" }
trc = { path = "../trc" }
nlp = { path = "../nlp" }
directory = { path =  "../directory" }
registry = { path = "../registry" }
calcard = { version = "0.3", features = ["rkyv"] }
hashify = "0.2"
tokio = { version = "1.53", features = ["net", "macros"] }
rkyv.workspace = true
percent-encoding = "2.3.2"
compact_str = "0.10.0"
ahash = { version = "0.8" }
indexmap = "2.14.0"
chrono = { version = "0.4.45", features = ["unstable-locales"] }
icu_locale_core = "2"
icu_plurals = "2"
icu_provider = { version = "2", features = ["sync"] }
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"

[features]
test_mode = []
enterprise = []

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }

[lints]
workspace = true
