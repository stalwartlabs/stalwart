[package]
name = "jmap-tools"
description = "JMAP object parser with JSON Pointer querying and patching support"
version = "1.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-SEL"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rkyv = { version = "0.8", optional = true }

[features]
default = []
rkyv = ["dep:rkyv"]

[lints]
workspace = true
