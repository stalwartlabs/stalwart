[package]
name = "smtp"
description = "Stalwart SMTP Server"
authors = [ "Stalwart Labs LLC <hello@stalw.art>"]
repository = "https://github.com/stalwartlabs/smtp-server"
homepage = "https://stalw.art/smtp"
keywords = ["smtp", "email", "mail", "server"]
categories = ["email"]
license = "AGPL-3.0-only OR LicenseRef-SEL"
version = "0.16.21"
edition = "2024"

[dependencies]
store = { path =  "../store" }
types = { path =  "../types" }
utils = { path =  "../utils" }
directory = { path =  "../directory" }
common = { path =  "../common" }
email = { path =  "../email" }
registry = { path =  "../registry" }
spam-filter = { path =  "../spam-filter" }
trc = { path = "../trc" }
mail-auth = { version = "0.12", features = ["rkyv"] }
mail-parser = { version = "0.11", features = ["full_encoding"] } 
mail-builder = { version = "0.5" } 
smtp-proto = { version = "0.2.3", features = ["rkyv", "serde"] }
sieve-rs = { version = "0.8", features = ["rkyv"] } 
ahash = { version = "0.8" }
rustls = { version = "0.23.43", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
sha2 = "0.11"
parking_lot = "0.12"
blake3 = "1.8"
rand = "0.10.2"
x509-parser = { version = "0.18", features = ["verify-aws"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rkyv.workspace = true
compact_str = "0.10.0"
hashify = { version = "0.2" }
base64 = "0.23"

[features]
test_mode = ["mail-auth/test"]
enterprise = []

#[[bench]]
#name = "hash"
#harness = false

[lints]
workspace = true
