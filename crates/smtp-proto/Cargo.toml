[package]
name = "smtp-proto"
description = "SMTP protocol parser"
version = "1.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-SEL"
publish = false

[dependencies]
memchr = "2"
rkyv = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
rkyv = ["dep:rkyv"]
serde = ["dep:serde"]

[lints]
workspace = true
