[package]
name = "store"
version = "1.0.1"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
types = { path = "../types" }
nlp = { path = "../nlp" }
trc = { path = "../trc" }
registry = { path = "../registry" }
rocksdb = { version = "0.25", optional = true, features = ["multi-threaded-cf"] }
foundationdb = { version = "0.11", features = ["embedded-fdb-include", "fdb-7_4"], optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
s3 = { path = "../s3", optional = true }
azure_core = { version = "1.1", default-features = false, features = ["reqwest", "tokio"], optional = true }
azure_storage_blob = { version = "1.1", default-features = false, features = ["tokio"], optional = true }
azure_identity = { version = "1.0", default-features = false, features = ["tokio"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"]}
tokio = { version = "1.54", features = ["sync", "fs", "io-util", "time", "rt", "rt-multi-thread"] }
r2d2 = { version = "0.8.10", optional = true }
futures = { version = "0.3", optional = true }
libc = { version = "0.2.191", optional = true }
rand = "0.10.3"
roaring = "0.11"
rayon = { version = "1.12", optional = true }
serde = { version = "1.0", features = ["derive"]}
ahash = { version = "0.8.12", features = ["serde"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
parking_lot = "0.13"
papaya = "0.2.5"
lru-cache = { version = "0.1.2", optional = true }
num_cpus = { version = "1.17", optional = true }
blake3 = "1.8"
lz4_flex = { version = "0.14", features = ["alloc"], default-features = false }
zstd = { version = "0.14", default-features = false }
deadpool-postgres = { version = "0.14", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"], optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"], optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
aws-lc-rs = { version = "1", optional = true }
x509-parser = { version = "0.18", optional = true }
bytes = { version = "1.12", optional = true }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls", "minimal"], optional = true }
serde_json = { version = "1.0.154" }
flate2 = "1.1"
redis = { version = "1.8", features = [ "tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "tls-rustls", "cluster-async", "sentinel"], optional = true }
deadpool = { version = "0.13", features = ["managed"], optional = true }
arc-swap = "1.9.3"
bitpacking = "0.9.3"
rkyv.workspace = true
compact_str = "0.10.0"
gethostname = "1.1.0"
radsort = "0.1.1"
indexmap = "2.14.2"
nohash-hasher = "0.2.0"
tinyvec = { version = "1.13.3", features = ["alloc"] }
encodify = "1.0"

[dev-dependencies]
tokio = { version = "1.54", features = ["full"] }

[features]
# Data Stores
rocks = ["rocksdb", "rayon", "num_cpus"]
sqlite = ["rusqlite", "rayon", "r2d2", "num_cpus", "lru-cache"]
postgres = ["tokio-postgres", "deadpool", "deadpool-postgres", "hashbrown", "tokio-rustls", "rustls", "aws-lc-rs", "rustls-pki-types", "x509-parser", "futures", "bytes"]
mysql = ["mysql_async", "futures"]
foundation = ["foundationdb", "futures", "libc"]
fdb-chunked-bm = []

# Blob stores
s3 = ["dep:s3", "bytes"]
azure = ["azure_core", "azure_storage_blob", "azure_identity", "aws-lc-rs", "futures"]

# In-memory stores
redis = ["dep:redis", "deadpool", "deadpool/rt_tokio_1", "futures"]

enterprise = ["utils/enterprise", "trc/enterprise", "registry/enterprise"]

[lints]
workspace = true
