[package]
name = "jmap"
version = "1.0.1"
edition = "2024"

[dependencies]
store = { path = "../store" }
nlp = { path = "../nlp" }
http_proto = { path = "../http-proto" }
jmap_proto = { path = "../jmap-proto" }
types = { path = "../types" }
smtp = { path =  "../smtp" }
utils = { path =  "../utils" }
common = { path =  "../common" }
services = { path =  "../services" }
directory = { path =  "../directory" }
trc = { path = "../trc" }
spam-filter = { path = "../spam-filter" }
email = { path = "../email" }
groupware = { path = "../groupware" }
registry = { path = "../registry" }
calcard = { path = "../calcard" }
smtp-proto = { path = "../smtp-proto" }
mail-parser = { version = "1.0", features = ["full_encoding"] } 
mail-builder = { version = "2.0" }
mail-auth = { version = "0.14", features = ["generate", "arc"] }
sieve-rs = { path = "../sieve" }
jmap-tools = { path = "../jmap-tools", features = ["rkyv"] }
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tokio = { version = "1.54", features = ["rt"] }
futures-util = "0.3.34"
async-stream = "0.3.6"
encodify = "1.0"
p256 = { version = "0.14", features = ["ecdh"] }
sha1 = "0.11"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"]}
tokio-tungstenite = "0.30"
tungstenite = "0.30"
jiff = "0.2.38"
rand = "0.10.3"
rkyv.workspace = true
hashify = "0.3"
compact_str = "0.10.0"
memchr = "2.8"

[features]
dev_mode = []
enterprise = ["store/enterprise", "http_proto/enterprise", "jmap_proto/enterprise", "smtp/enterprise", "utils/enterprise", "common/enterprise", "services/enterprise", "directory/enterprise", "trc/enterprise", "spam-filter/enterprise", "email/enterprise", "groupware/enterprise", "registry/enterprise"]

[lints]
workspace = true
