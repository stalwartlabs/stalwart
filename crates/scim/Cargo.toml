[package]
name = "scim"
version = "1.0.1"
edition = "2024"

[dependencies]
scim-proto = { path = "../scim-proto" }
common = { path = "../common" }
jmap = { path = "../jmap" }
services = { path = "../services" }
store = { path = "../store" }
registry = { path = "../registry" }
directory = { path = "../directory" }
http_proto = { path = "../http-proto" }
jmap_proto = { path = "../jmap-proto" }
types = { path = "../types" }
utils = { path = "../utils" }
trc = { path = "../trc" }
compact_str = "0.10.0"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
icu_locale = "2.4.0"

[dev-dependencies]

[features]
dev_mode = []
enterprise = ["common/enterprise", "jmap/enterprise", "services/enterprise", "store/enterprise", "directory/enterprise", "trc/enterprise", "registry/enterprise", "http_proto/enterprise", "jmap_proto/enterprise", "utils/enterprise"]

[lints]
workspace = true
