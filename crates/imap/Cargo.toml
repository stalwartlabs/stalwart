[package]
name = "imap"
version = "1.0.1"
edition = "2024"

[dependencies]
imap_proto = { path = "../imap-proto" }
types = { path = "../types" }
directory = { path = "../directory" }
trc = { path = "../trc" }
store = { path = "../store" }
common = { path = "../common" }
email = { path = "../email" }
nlp = { path = "../nlp" }
utils = { path = "../utils" }
registry = { path = "../registry" }
mail-parser = { version = "1.0", features = ["full_encoding"] } 
encodify = "1.0"
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
parking_lot = "0.13"
ahash = { version = "0.8" }
rand = "0.10.3"
compact_str = "0.10.0"

[features]
enterprise = ["directory/enterprise", "trc/enterprise", "store/enterprise", "common/enterprise", "email/enterprise", "utils/enterprise", "registry/enterprise"]

[lints]
workspace = true
