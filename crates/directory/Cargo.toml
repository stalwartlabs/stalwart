[package]
name = "directory"
version = "0.16.19"
edition = "2024"

[dependencies]
utils = { path =  "../utils" }
proc_macros = { path =  "../utils/proc-macros" }
store = { path =  "../store" }
trc = { path = "../trc" }
nlp = { path = "../nlp" }
types = { path = "../types" }
registry = { path = "../registry" }
mail-parser = { version = "0.11" }
mail-builder = { version = "0.5" } 
tokio = { version = "1.53", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.43", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1" }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
ahash = { version = "0.8" }
pwhash = "1"
argon2 = "0.5.3"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
scrypt = "0.11.0"
sha1 = "0.11"
sha2 = "0.11"
md5 = "0.8.1"
futures = "0.3"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"]}
totp-rs = { version = "5.7.2", features = ["otpauth"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0"
base64 = "0.23"
rkyv = { version = "0.8.17", features = ["little_endian"] }
compact_str = { version = "0.10.0", features = ["rkyv", "serde"] }
nohash-hasher = "0.2.0"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }

[features]
test_mode = []
enterprise = []
mysql = []
postgres = []
sqlite = []
