[package]
name = "common"
version = "1.0.1"
edition = "2024"
build = "build.rs"

[dependencies]
utils = { path = "../utils" }
nlp = { path = "../nlp" }
store = { path = "../store" }
trc = { path = "../trc" }
telemetry = { path = "../telemetry" }
directory = { path = "../directory" }
coordinator = { path = "../coordinator" }
types = { path = "../types" }
registry = { path = "../registry" }
jmap_proto = { path = "../jmap-proto" }
sieve-rs = { path = "../sieve", features = ["serde"] }
mail-parser = { version = "1.0", features = ["full_encoding"] } 
mail-builder = { version = "2.0" }
mail-auth = { version = "0.14", features = ["generate", "arc"] }
smtp-report = { path = "../smtp-report" }
smtp-proto = { path = "../smtp-proto", features = ["rkyv"] }
dns-update = { version = "0.6" }
calcard = { path = "../calcard", features = ["rkyv"] }
ahash = { version = "0.8.12", features = ["serde"] }
parking_lot = "0.13.0"
proxy-header = { version = "0.1.3", features = ["tokio"] }
arc-swap = "1.9.3"
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = { version = "1" }
aws-lc-rs = { version = "1" }
tokio = { version = "1.54", features = ["net", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
socket2 = { version = "0.6", features = ["all"] }
futures = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"]}
serde = { version = "1.0", features = ["derive"]}
serde_json = { version = "1.0", features = ["raw_value"] }
encodify = "1.0"
x509-parser = "0.18"
pem = "4.0"
jiff = "0.2.38"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
imagesize = "0.15"
sha1 = "0.11"
sha2 = "0.11"
siphasher = "1"
md5 = "0.8.1"
whatlang = "0.18"
idna = "1.1"
decancer = "4.0.0"
unicode-security = "0.1.2"
infer = "0.22"
bincode = { version = "2.0.1", features = ["serde"] }
hostname = "0.4.2"
zip = "9.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
psl = "2"
aes-gcm-siv = "0.12.1"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rsa = "0.9.10"
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.14", features = ["ecdh"] }
hashify = "0.3"
rkyv.workspace = true
tinyvec = { version = "1.13.3", features = ["alloc"] }
compact_str = { version = "0.10.0", features = ["rkyv", "serde"] }
bytes = "1"
lz4_flex = { version = "0.14", features = ["frame"], default-features = false }
hickory-proto = "0.26.3"
nohash-hasher = "0.2.0"
quick_cache = "0.7"
rasn = "0.29"
rasn-pkix = "0.29"
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
zxcvbn = "3.1.1"
pkcs8 = { version = "0.11.0", features = ["alloc", "std"] }
quick-xml = "0.42"
percent-encoding = "2.3.2"
bumpalo = { version = "3.20.3", features = ["collections"] }
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "perf-inline", "perf-literal", "unicode"] }
memchr = "2.8.3"
itoa = "1.0.18"
zmij = "1.0.23"

[target.'cfg(unix)'.dependencies]
privdrop = "0.5.7"
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"

[target.'cfg(stalwart_tests)'.dependencies]
dns-update = { version = "0.6", features = ["test_provider"] }

[features]
dev_mode = []
enterprise = ["store/enterprise", "utils/enterprise", "trc/enterprise", "telemetry/enterprise", "directory/enterprise", "coordinator/enterprise", "registry/enterprise", "jmap_proto/enterprise"]
foundation = []
redis = ["store/redis"]

[dev-dependencies]
tokio = { version = "1.54", features = ["full"] }
regex = "1.13.1"

[lints]
workspace = true
