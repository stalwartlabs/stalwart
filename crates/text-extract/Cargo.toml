[package]
name = "text-extract"
version = "1.0.1"
edition = "2024"

[dependencies]
memchr = "2.8"
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
mail-parser = { version = "1.0", default-features = false }
hashify = "0.3"
aws-lc-rs = { version = "1" }
md5 = "0.8.1"

[dev-dependencies]
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
