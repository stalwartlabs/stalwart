[package]
name = "text-extract"
version = "0.16.21"
edition = "2024"

[dependencies]
memchr = "2.8"
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
mail-parser = { version = "0.11", default-features = false }
hashify = "0.2.9"

[dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41"

[[bench]]
name = "extract"
harness = false

[lints]
workspace = true
