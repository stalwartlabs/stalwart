[package]
name = "jmap_proto"
version = "0.16.23"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
types = { path = "../types" }
trc = { path = "../trc" }
registry = { path = "../registry" }
jmap-tools = { version = "0.1.9" }
calcard = { version = "0.4" }
mail-parser = { version = "0.11", features = ["full_encoding", "rkyv"] } 
serde = { version = "1.0", features = ["derive"]}
ahash = { version = "0.8.12", features = ["serde"] }
serde_json = { version = "1.0", features = ["raw_value"] }
simdutf8 = "0.1.5"
sonic-rs = "0.5.10"
hashify = "0.3"
rkyv.workspace = true
compact_str = { version = "0.10.0", features = ["rkyv", "serde"] }

[dev-dependencies]

[lints]
workspace = true
