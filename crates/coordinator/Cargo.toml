[package]
name = "coordinator"
version = "0.16.19"
edition = "2024"

[dependencies]
utils = { path =  "../utils" }
store = { path =  "../store" }
registry = { path =  "../registry" }
trc = { path = "../trc" }
futures = { version = "0.3", optional = true }
tokio = { version = "1.53", features = ["sync", "fs", "io-util"] }
async-nats = { version = "0.50", default-features = false, features = ["server_2_10", "server_2_11", "aws-lc-rs"], optional = true }
zenoh = { version = "1.9.0", default-features = false, features = ["auth_pubkey", "transport_multilink", "transport_compression", "transport_quic", "transport_tcp", "transport_tls", "transport_udp"], optional = true }
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }
redis = { version = "1.5", features = [ "tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "tls-rustls", "cluster-async", "sentinel"], optional = true }

[features]
nats = ["async-nats", "futures"]
zenoh = ["dep:zenoh"]
kafka = ["rdkafka"]
redis = ["dep:redis", "futures"]
enterprise = []
test_mode = []
