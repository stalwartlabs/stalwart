[package]
name = "exchange-proto"
description = "EWS, Autodiscover, Exchange ActiveSync and MAPI over HTTP protocol codecs"
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-SEL"
publish = false

[dependencies]
ahash = "0.8.12"
ammonia = "4.2.4"
arrayvec = "0.7"
bytes = "1"
calcard = { path = "../calcard", optional = true }
compact_str = "0.10.0"
crc32fast = "1.5"
encodify = "1.0"
hashbrown = "0.17.1"
hashify = "0.3"
html5ever = "0.40"
jiff = { version = "0.2.38", optional = true }
mail-builder = { version = "2.0", optional = true }
mail-parser = { version = "1.0", features = ["full_encoding"], optional = true }
memchr = "2.8.3"
quick-xml = "0.42"
roaring = "0.11"
simdutf8 = "0.1.5"
smallvec = { version = "1.16", features = ["union"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sieve-rs = { path = "../sieve" }
zstd = { version = "0.14", default-features = false }

[features]
default = ["convert"]
convert = ["dep:mail-parser", "dep:mail-builder", "dep:calcard", "dep:jiff"]

[lints]
workspace = true
