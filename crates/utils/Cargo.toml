[package]
name = "utils"
version = "0.16.21"
edition = "2024"

[dependencies]
trc = { path = "../trc" }
rustls = { version = "0.23.43", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1" }
rustls-platform-verifier = "0.7"
tokio = { version = "1.53", features = ["net", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
serde = { version = "1.0", features = ["derive"]}
mail-auth = { version = "0.12" }
ahash = { version = "0.8", features = ["serde"] }
chrono = "0.4"
aws-lc-rs = { version = "1" }
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"]}
futures = "0.3"
form_urlencoded = "1.2.2"
psl = "2"
idna = "1.1"
quick_cache = "0.7"
rkyv.workspace = true
compact_str = "0.10.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
farmhash = "1.1.5"
nohash-hasher = "0.2.0"
arcstr = "1.2.0"

[target.'cfg(unix)'.dependencies]
privdrop = "0.5.6"

[features]
test_mode = []

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }

[lints]
workspace = true
