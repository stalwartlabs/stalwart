[package]
name = "sieve-rs"
description = "Sieve filter interpreter"
version = "1.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-SEL"
publish = false

[lib]
name = "sieve"
doctest = false

[dependencies]
mail-parser = { version = "1.0", features = ["full_encoding"] }
fancy-regex = "0.20.0"
bumpalo = { version = "3.20", features = ["collections"] }
memchr = "2.8"
encodify = "1.0"
smallvec = "1.16"
hashbrown = "0.17.1"
hashify = "0.3"
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
mail-builder = { version = "2.0" }
ahash = { version = "0.8.12" }

[dev-dependencies]
mail-parser = { version = "1.0", features = ["full_encoding", "serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
evalexpr = "13.1.0"

[features]
default = []
serde = ["dep:serde", "mail-parser/serde"]

[lints]
workspace = true
