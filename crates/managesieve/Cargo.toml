[package]
name = "managesieve"
version = "1.0.1"
edition = "2024"

[dependencies]
imap_proto = { path = "../imap-proto" }
imap = { path = "../imap" }
types = { path = "../types" }
jmap_proto = { path = "../jmap-proto" }
directory = { path = "../directory" }
common = { path = "../common" }
store = { path = "../store" }
email = { path = "../email" }
trc = { path = "../trc" }
registry = { path = "../registry" }
encodify = "1.0"
sieve-rs = { path = "../sieve" }
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
compact_str = "0.10.0"

[features]
enterprise = ["imap/enterprise", "jmap_proto/enterprise", "directory/enterprise", "common/enterprise", "store/enterprise", "email/enterprise", "trc/enterprise", "registry/enterprise"]

[lints]
workspace = true
