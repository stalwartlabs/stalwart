[package]
name = "dav-proto"
version = "0.16.23"
edition = "2024"

[dependencies]
trc = { path = "../trc" }
types = { path = "../types" }
hashify = "0.2.9"
quick-xml = "0.41"
calcard = { version = "0.4", features = ["rkyv"] }
mail-parser = { version = "0.11", features = ["full_encoding", "rkyv"] }
hyper = "1.11.1"
compact_str = "0.10.0"

[dev-dependencies]
calcard = { version = "0.4", features = ["serde", "rkyv"] }
types = { path = "../types", features = ["test_mode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
test_mode = []
enterprise = []

[lints]
workspace = true
