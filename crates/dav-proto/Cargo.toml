[package]
name = "dav-proto"
version = "1.0.1"
edition = "2024"

[dependencies]
trc = { path = "../trc" }
types = { path = "../types" }
hashify = "0.3"
quick-xml = "0.42"
calcard = { path = "../calcard", features = ["rkyv"] }
mail-parser = { version = "1.0", features = ["full_encoding"] }
hyper = "1.12.0"
compact_str = "0.10.0"
memchr = "2.8.3"

[dev-dependencies]
calcard = { path = "../calcard", features = ["serde", "rkyv"] }
types = { path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
enterprise = ["trc/enterprise"]

[lints]
workspace = true
