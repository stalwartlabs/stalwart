[package]
name = "smtp-report"
description = "DMARC aggregate, ARF and TLS-RPT report generation and parsing"
version = "1.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-SEL"
publish = false

[lib]
name = "smtp_report"
doctest = false

[dependencies]
mail-auth = { version = "0.14", features = ["arc"] }
mail-parser = { version = "1.0", features = ["full_encoding"] }
mail-builder = { version = "2.0" }
flate2 = "1.1"
quick-xml = "0.42"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
hashify = "0.3"
memchr = "2.8"
simdutf8 = "0.1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
