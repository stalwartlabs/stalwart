<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Respond to invitation</title>
    <link rel="stylesheet" href="../ui-HASH.css">
    <script src="../ui-HASH.js"></script>
    <style>
        .card.wide {
            gap: 1.75rem;
        }

        .event-head {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
            gap: 0.625rem;
        }

        .fact {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            min-width: 0;
            padding: 0.875rem 1rem;
            border-radius: calc(var(--radius) + 4px);
            background: var(--muted);
            font-size: 0.875rem;
            line-height: 1.45;
        }

        .fact>div {
            min-width: 0;
            padding-top: 0.3125rem;
            overflow-wrap: anywhere;
        }

        .fact-icon {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 9999px;
            background: var(--card);
            color: var(--brand-text);
        }

        .section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.625rem;
        }

        .desc {
            font-size: 0.875rem;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .desc.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .people {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .person {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            min-width: 0;
            font-size: 0.875rem;
        }

        .person .who {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dot {
            flex-shrink: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1.5px var(--dim);
        }

        .dot.accepted {
            background: var(--success);
            box-shadow: none;
        }

        .dot.declined {
            background: var(--destructive);
            box-shadow: none;
        }

        .dot.tentative {
            background: var(--warning);
            box-shadow: none;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.25rem;
            border-radius: calc(var(--radius) + 8px);
            background: var(--muted);
        }

        @media (min-width: 40em) {
            .panel {
                padding: 1.5rem;
            }
        }

        .reply-as {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            overflow-wrap: anywhere;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .choice {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: 0.875rem 0.25rem;
            border: 0;
            border-radius: calc(var(--radius) + 4px);
            background: var(--card);
            box-shadow: var(--shadow-tile);
            color: var(--foreground);
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
        }

        .choice svg {
            color: var(--dim);
        }

        .choice:hover {
            box-shadow: inset 0 0 0 1px var(--input), var(--shadow-tile);
        }

        .choice:focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        .choice[aria-checked=true] {
            --tone: var(--success);
            background: var(--success-soft);
        }

        .choice[data-value=tentative][aria-checked=true] {
            --tone: var(--warning);
            background: var(--warning-soft);
        }

        .choice[data-value=declined][aria-checked=true] {
            --tone: var(--destructive);
            background: var(--destructive-soft);
        }

        .choice[aria-checked=true],
        .choice[aria-checked=true] svg {
            color: var(--tone);
        }

        .choice[aria-checked=true],
        .choice[aria-checked=true]:hover {
            box-shadow: inset 0 0 0 1.5px var(--tone);
        }

        .note-label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }

        #note-count {
            font-size: 0.75rem;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .skeleton {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
        }

        .sk {
            height: 12px;
            border-radius: 9999px;
            background: linear-gradient(90deg, var(--muted) 25%, var(--muted-strong) 37%, var(--muted) 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
        }

        .sk.title {
            width: 70%;
            height: 24px;
        }

        .sk.short {
            width: 30%;
        }

        .sk.box {
            height: 88px;
            border-radius: calc(var(--radius) + 4px);
        }

        @keyframes shimmer {
            0% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0 50%;
            }
        }

        .noscript {
            font-size: 0.875rem;
            text-align: center;
        }
    </style>
</head>

<body data-page="rsvp">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch theme">
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
    </button>

    <main class="card wide stack">
        <div class="logo-wrap" id="logo-wrap"></div>

        <noscript>
            <style>
                #view-loading {
                    display: none;
                }
            </style>
            <p class="noscript">This page needs JavaScript to load the invitation. Enable it, or respond from your
                calendar application instead.</p>
        </noscript>

        <div id="view-loading" class="skeleton" aria-live="polite">
            <div class="sk short"></div>
            <div class="sk title"></div>
            <div class="sk box"></div>
        </div>

        <div id="view-error" class="outcome" hidden aria-live="polite">
            <div class="badge neutral" id="error-badge">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
            </div>
            <h2 id="error-title" tabindex="-1">Something went wrong</h2>
            <p id="error-detail"></p>
        </div>

        <div id="view-event" class="stack" hidden>
            <div class="event-head">
                <span class="eyebrow" id="kind">Invitation</span>
                <h1 class="page-title" id="summary"></h1>
                <p class="lead" id="byline" hidden></p>
            </div>

            <div class="facts" id="meta">
                <div class="fact" id="row-when" hidden>
                    <span class="fact-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg></span>
                    <div id="when"></div>
                </div>
                <div class="fact" id="row-repeat" hidden>
                    <span class="fact-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <polyline points="17 1 21 5 17 9" />
                            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                            <polyline points="7 23 3 19 7 15" />
                            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                        </svg></span>
                    <div id="repeat"></div>
                </div>
                <div class="fact" id="row-where" hidden>
                    <span class="fact-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg></span>
                    <div id="where"></div>
                </div>
                <div class="fact" id="row-conference" hidden>
                    <span class="fact-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <polygon points="23 7 16 12 23 17 23 7" />
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                        </svg></span>
                    <div><a id="conference" href="#" rel="noreferrer noopener" target="_blank"></a></div>
                </div>
            </div>

            <div class="section" id="section-desc" hidden>
                <h2 class="section-title" id="desc-title">Description</h2>
                <div class="desc clamped" id="desc"></div>
                <button type="button" class="linkish" id="desc-toggle" aria-expanded="false" aria-controls="desc"
                    hidden>Show more</button>
            </div>

            <div class="section" id="section-people" hidden>
                <h2 class="section-title" id="people-title">Attendees</h2>
                <div class="people" id="people"></div>
                <button type="button" class="linkish" id="people-toggle" aria-expanded="false" aria-controls="people"
                    hidden></button>
            </div>

            <div class="panel" id="respond">
                <div class="reply-as" id="reply-as"></div>
                <div class="choices" id="choices" role="radiogroup" aria-labelledby="reply-as">
                    <button type="button" class="choice" data-value="accepted" role="radio" aria-checked="false"
                        tabindex="0">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                        <span id="label-accepted">Yes</span>
                    </button>
                    <button type="button" class="choice" data-value="tentative" role="radio" aria-checked="false"
                        tabindex="-1">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                            <line x1="12" y1="17" x2="12.01" y2="17" />
                            <circle cx="12" cy="12" r="10" />
                        </svg>
                        <span id="label-tentative">Maybe</span>
                    </button>
                    <button type="button" class="choice" data-value="declined" role="radio" aria-checked="false"
                        tabindex="-1">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                        <span id="label-declined">No</span>
                    </button>
                </div>

                <div id="note-wrap" hidden>
                    <div class="note-label">
                        <label class="label" for="note" id="note-label">Note to the organizer (optional)</label>
                        <span id="note-count"></span>
                    </div>
                    <textarea class="textarea" id="note" maxlength="512" rows="3"
                        placeholder="Running ten minutes late, start without me."></textarea>
                </div>

                <div class="alert" id="alert" hidden aria-live="polite">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span id="alert-msg"></span>
                </div>

                <button type="button" class="btn" id="send" disabled>Send response</button>
            </div>

            <div class="panel" id="recorded" hidden aria-live="polite">
                <div class="outcome">
                    <div class="badge" id="recorded-badge">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    </div>
                    <h2 id="recorded-title" tabindex="-1">Your response has been recorded</h2>
                    <p id="recorded-detail"></p>
                    <button type="button" class="linkish" id="change">Change my response</button>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
