calendar.imip_footer_1:
  en_US: You're receiving this e-mail as you're listed as a participant for this event.
  es_ES: Recibes este correo electrónico porque estás registrado como participante de este evento.
  fr_FR: Vous recevez cet e-mail car vous êtes inscrit comme participant à cet événement.
  de_DE: Sie erhalten diese E-Mail, weil Sie als Teilnehmer für dieses Ereignis aufgeführt sind.
  it_IT: Ricevi questa e-mail perché sei elencato come partecipante a questo evento.
  pt_PT: Você está recebendo este e-mail porque está listado como participante deste evento.
  nl_NL: U ontvangt deze e-mail omdat u staat vermeld als deelnemer aan dit evenement.
  da_DK: Du modtager denne e-mail, fordi du er opført som deltager i denne begivenhed.
  ca_ES: Reps aquest correu electrònic perquè ets registrat com a participant d'aquest esdeveniment.
  el_GR: Λαμβάνετε αυτό το e-mail καθώς είστε στη λίστα συμμετεχόντων αυτής της εκδήλωσης.
  sv_SE: Du får det här mejlet för att du är uppskriven som deltagare i den här händelsen
  pl_PL: Otrzymujesz tego e-maila, ponieważ jesteś uczestnikiem tego wydarzenia.

calendar.imip_footer_2:
  en_US: Forwarding this e-mail could allow any recipient to reply to the organizer, join the guest list, extend the invitation to others, or alter your RSVP.
  es_ES: Reenviar este correo electrónico podría permitir que cualquier destinatario responda al organizador, se una a la lista de invitados, extienda la invitación a otros o modifique tu confirmación de asistencia.
  fr_FR: Le transfert de cet e-mail pourrait permettre à tout destinataire de répondre à l'organisateur, de rejoindre la liste des invités, d'étendre l'invitation à d'autres ou de modifier votre RSVP.
  de_DE: Das Weiterleiten dieser E-Mail könnte es jedem Empfänger ermöglichen, dem Organisator zu antworten, der Gästeliste beizutreten, die Einladung an andere weiterzugeben oder Ihre Zusage zu ändern.
  it_IT: L'inoltro di questa e-mail potrebbe consentire a qualsiasi destinatario di rispondere all'organizzatore, unirsi alla lista degli ospiti, estendere l'invito ad altri o modificare la tua conferma di partecipazione.
  pt_PT: Encaminhar este e-mail pode permitir que qualquer destinatário responda ao organizador, se junte à lista de convidados, estenda o convite a outros ou altere sua confirmação de presença.
  nl_NL: Het doorsturen van deze e-mail kan elke ontvanger in staat stellen om te reageren op de organisator, deel te nemen aan de gastenlijst, de uitnodiging uit te breiden naar anderen, of uw RSVP te wijzigen.
  da_DK: Videresendelse af denne e-mail kan give andre mulighed for at svare arrangøren, tilslutte sig gæstelisten, videreformidle invitationen eller ændre din tilmelding.
  ca_ES: Reenviar aquest correu electrònic podria fer que qualsevol destinatari respongues a l'organitzador, afegir-se a la llista de convidats, estengui la invitació a d'altres o modificar la teva confirmació d'assistència.
  el_GR: Προωθόντας αυτό το e-mail μπορεί να επιτρέψει σε οποιοδήποτε παραλήπτη να απαντήση στον οργανωτή, να μπει στη λίστα επισκεπτών, να επεκτείνει τη πρόσκληση σε άλλους ή να αλλάξει την παρουσία σας.
  sv_SE: Att vidarebefordra det här mejlet kan göra det möjligt för vilken mottagare som helst att skicka svar till arrangören, lägga till sig själv på gästlistan, skicka inbjudan vidare till andra, samt ändra ditt svar.
  pl_PL: Przekazanie tej wiadomości e-mail może umożliwić każdemu odbiorcy odpowiedź do organizatora, dołączenie do listy gości, przesłanie zaproszenia innym osobom lub zmianę Twojej odpowiedzi RSVP.

