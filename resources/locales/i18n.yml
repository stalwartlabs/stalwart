calendar.imip_footer_1:
  en-US: You're receiving this e-mail as you're listed as a participant for this event.
  es-ES: Recibes este correo electrónico porque estás registrado como participante de este evento.
  fr-FR: Vous recevez cet e-mail car vous êtes inscrit comme participant à cet événement.
  de-DE: Sie erhalten diese E-Mail, weil Sie als Teilnehmer für dieses Ereignis aufgeführt sind.
  it-IT: Ricevi questa e-mail perché sei elencato come partecipante a questo evento.
  pt-PT: Está a receber este e-mail porque está indicado como participante neste evento.
  nl-NL: U ontvangt deze e-mail omdat u staat vermeld als deelnemer aan dit evenement.
  da-DK: Du modtager denne e-mail, fordi du er opført som deltager i denne begivenhed.
  ca-ES: Reps aquest correu electrònic perquè estàs registrat com a participant d'aquest esdeveniment.
  el-GR: Λαμβάνετε αυτό το e-mail καθώς είστε στη λίστα συμμετεχόντων αυτής της εκδήλωσης.
  sv-SE: Du får det här mejlet eftersom du är uppskriven som deltagare i den här händelsen.
  pl-PL: Otrzymujesz tego e-maila, ponieważ jesteś uczestnikiem tego wydarzenia.
  pt-BR: Você está recebendo este e-mail porque está listado como participante deste evento.
  ru-RU: Вы получаете это письмо, так как указаны участником этого события.
  uk-UA: Ви отримуєте цей лист, оскільки вас зазначено учасником цієї події.
  bg-BG: Получавате този имейл, защото сте посочени като участник в това събитие.
  cs-CZ: Tento e-mail dostáváte, protože jste uvedeni jako účastník této události.
  sk-SK: Tento e-mail dostávate, pretože ste uvedený ako účastník tejto udalosti.
  sl-SI: To e-pošto prejemate, ker ste navedeni kot udeleženec tega dogodka.
  hr-HR: Ovu e-poštu primate jer ste navedeni kao sudionik ovog događaja.
  lt-LT: Šį el. laišką gaunate, nes esate nurodytas kaip šio įvykio dalyvis.
  hu-HU: Azért kapja ezt az e-mailt, mert az esemény résztvevői között szerepel.
  ro-RO: Primiți acest e-mail deoarece sunteți listat ca participant la acest eveniment.
  fi-FI: Saat tämän sähköpostin, koska sinut on merkitty tämän tapahtuman osallistujaksi.
  nb-NO: Du mottar denne e-posten fordi du er oppført som deltaker på denne hendelsen.
  tr-TR: Bu etkinliğin katılımcısı olarak listelendiğiniz için bu e-postayı alıyorsunuz.
  zh-CN: 您收到此邮件是因为您被列为此活动的参与者。
  zh-TW: 您收到這封郵件是因為您被列為此活動的參與者。
  ja-JP: この予定の参加者として登録されているため、このメールが送信されています。
  ko-KR: 이 일정의 참석자로 등록되어 있어 이 이메일을 받고 있습니다.
  th-TH: คุณได้รับอีเมลนี้เพราะคุณอยู่ในรายชื่อผู้เข้าร่วมกิจกรรมนี้
  vi-VN: Bạn nhận được email này vì bạn có tên trong danh sách người tham dự sự kiện này.
  id-ID: Anda menerima email ini karena Anda terdaftar sebagai peserta acara ini.
  hi-IN: आपको यह ईमेल इसलिए मिल रहा है क्योंकि आप इस इवेंट में प्रतिभागी के रूप में सूचीबद्ध हैं।
  ar-SA: تتلقى هذه الرسالة لأنك مُدرَج كمشارك في هذا الحدث.
  he-IL: קיבלת הודעה זו כי את/ה רשום/ה כמשתתף באירוע זה.
  fa-IR: این ایمیل را دریافت می‌کنید چون به‌عنوان شرکت‌کننده این رویداد فهرست شده‌اید.

calendar.imip_footer_2:
  en-US: Forwarding this e-mail could allow any recipient to reply to the organizer, join the guest list, extend the invitation to others, or alter your RSVP.
  es-ES: Reenviar este correo electrónico podría permitir que cualquier destinatario responda al organizador, se una a la lista de invitados, extienda la invitación a otros o modifique tu confirmación de asistencia.
  fr-FR: Le transfert de cet e-mail pourrait permettre à tout destinataire de répondre à l'organisateur, de rejoindre la liste des invités, d'étendre l'invitation à d'autres ou de modifier votre réponse.
  de-DE: Das Weiterleiten dieser E-Mail könnte es jedem Empfänger ermöglichen, dem Organisator zu antworten, der Gästeliste beizutreten, die Einladung an andere weiterzugeben oder Ihre Antwort zu ändern.
  it-IT: L'inoltro di questa e-mail potrebbe consentire a qualsiasi destinatario di rispondere all'organizzatore, unirsi alla lista degli ospiti, estendere l'invito ad altri o modificare la tua conferma di partecipazione.
  pt-PT: Encaminhar este e-mail pode permitir que qualquer destinatário responda ao organizador, se junte à lista de convidados, estenda o convite a outros ou altere a sua confirmação de presença.
  nl-NL: Het doorsturen van deze e-mail kan elke ontvanger in staat stellen om te reageren op de organisator, deel te nemen aan de gastenlijst, de uitnodiging aan anderen door te geven, of uw antwoord te wijzigen.
  da-DK: Videresendelse af denne e-mail kan give andre mulighed for at svare arrangøren, tilslutte sig gæstelisten, videreformidle invitationen eller ændre din tilmelding.
  ca-ES: Reenviar aquest correu electrònic podria permetre que qualsevol destinatari respongui a l'organitzador, s'afegeixi a la llista de convidats, estengui la invitació a altres persones o modifiqui la teva confirmació d'assistència.
  el-GR: Η προώθηση αυτού του e-mail μπορεί να επιτρέψει σε οποιονδήποτε παραλήπτη να απαντήσει στον διοργανωτή, να μπει στη λίστα καλεσμένων, να επεκτείνει την πρόσκληση σε άλλους ή να αλλάξει τη δήλωση παρουσίας σας.
  sv-SE: Att vidarebefordra det här mejlet kan göra det möjligt för vilken mottagare som helst att skicka svar till arrangören, lägga till sig själv på gästlistan, skicka inbjudan vidare till andra, samt ändra ditt svar.
  pl-PL: Przekazanie tej wiadomości e-mail może umożliwić każdemu odbiorcy odpowiedź do organizatora, dołączenie do listy gości, przesłanie zaproszenia innym osobom lub zmianę Twojej odpowiedzi RSVP.
  pt-BR: Encaminhar este e-mail pode permitir que qualquer destinatário responda ao organizador, entre na lista de convidados, estenda o convite a outros ou altere sua confirmação de presença.
  ru-RU: Пересылка этого письма может позволить любому получателю ответить организатору, добавиться в список гостей, переслать приглашение другим или изменить ваш ответ.
  uk-UA: Пересилання цього листа може дозволити будь-якому одержувачу відповісти організатору, долучитися до списку гостей, переслати запрошення іншим або змінити вашу відповідь.
  bg-BG: Препращането на този имейл може да позволи на всеки получател да отговори на организатора, да се включи в списъка с гости, да препрати поканата на други или да промени вашия отговор.
  cs-CZ: Přeposlání tohoto e-mailu může komukoli z příjemců umožnit odpovědět organizátorovi, přidat se na seznam hostů, předat pozvánku dalším nebo změnit vaši odpověď.
  sk-SK: Preposlanie tohto e-mailu môže komukoľvek z príjemcov umožniť odpovedať organizátorovi, pridať sa do zoznamu hostí, poslať pozvánku ďalším alebo zmeniť vašu odpoveď.
  sl-SI: Posredovanje te e-pošte lahko vsakemu prejemniku omogoči, da odgovori organizatorju, se doda na seznam gostov, vabilo posreduje drugim ali spremeni vaš odgovor.
  hr-HR: Prosljeđivanje ove e-pošte može svakom primatelju omogućiti da odgovori organizatoru, pridruži se popisu gostiju, proslijedi pozivnicu drugima ili promijeni vaš odgovor.
  lt-LT: Persiuntus šį el. laišką bet kuris gavėjas galės atsakyti organizatoriui, prisidėti prie svečių sąrašo, persiųsti kvietimą kitiems arba pakeisti jūsų atsakymą.
  hu-HU: Az e-mail továbbítása lehetővé teheti bármely címzettnek, hogy válaszoljon a szervezőnek, felkerüljön a vendéglistára, továbbküldje a meghívót másoknak, vagy módosítsa az Ön válaszát.
  ro-RO: Redirecționarea acestui e-mail ar putea permite oricărui destinatar să răspundă organizatorului, să se adauge pe lista de invitați, să trimită invitația altora sau să vă modifice răspunsul.
  fi-FI: Tämän viestin välittäminen voi antaa kenelle tahansa vastaanottajalle mahdollisuuden vastata järjestäjälle, liittyä vieraslistalle, välittää kutsun muille tai muuttaa vastaustasi.
  nb-NO: Videresending av denne e-posten kan gi enhver mottaker mulighet til å svare arrangøren, bli med på gjestelisten, sende invitasjonen videre til andre eller endre svaret ditt.
  tr-TR: Bu e-postayı iletmek, herhangi bir alıcının düzenleyene yanıt vermesine, konuk listesine katılmasına, daveti başkalarına iletmesine veya yanıtınızı değiştirmesine olanak tanıyabilir.
  zh-CN: 转发此邮件可能会使任何收件人能够回复组织者、加入来宾名单、将邀请转发给他人或更改您的回复。
  zh-TW: 轉寄這封郵件可能會讓任何收件者回覆主辦人、加入來賓名單、將邀請轉寄給他人或變更您的回覆。
  ja-JP: このメールを転送すると、受信者が主催者に返信したり、ゲストリストに参加したり、他の人に招待を転送したり、あなたの出欠を変更したりできる場合があります。
  ko-KR: 이 이메일을 전달하면 수신자가 주최자에게 회신하거나, 참석자 목록에 참여하거나, 다른 사람에게 초대를 전달하거나, 회신을 변경할 수 있습니다.
  th-TH: การส่งต่ออีเมลนี้อาจทำให้ผู้รับคนใดก็ตามตอบกลับผู้จัด เข้าร่วมรายชื่อผู้เข้าร่วม ส่งต่อคำเชิญให้ผู้อื่น หรือเปลี่ยนการตอบรับของคุณได้
  vi-VN: Việc chuyển tiếp email này có thể cho phép bất kỳ người nhận nào trả lời người tổ chức, tham gia danh sách khách mời, chuyển lời mời cho người khác hoặc thay đổi phản hồi của bạn.
  id-ID: Meneruskan email ini dapat memungkinkan penerima mana pun membalas penyelenggara, bergabung dengan daftar tamu, meneruskan undangan kepada orang lain, atau mengubah jawaban Anda.
  hi-IN: इस ईमेल को अग्रेषित करने से कोई भी प्राप्तकर्ता आयोजक को उत्तर दे सकता है, अतिथि सूची में शामिल हो सकता है, आमंत्रण दूसरों को भेज सकता है या आपका उत्तर बदल सकता है।
  ar-SA: قد تتيح إعادة توجيه هذه الرسالة لأي مستلم الرد على المنظم، أو الانضمام إلى قائمة الضيوف، أو إرسال الدعوة إلى آخرين، أو تغيير ردك.
  he-IL: העברת הודעה זו עלולה לאפשר לכל נמען להשיב למארגן, להצטרף לרשימת האורחים, להעביר את ההזמנה לאחרים או לשנות את תשובתך.
  fa-IR: هدایت این ایمیل ممکن است به هر گیرنده‌ای اجازه دهد به برگزارکننده پاسخ دهد، به فهرست مهمانان بپیوندد، دعوت را برای دیگران بفرستد یا پاسخ شما را تغییر دهد.

