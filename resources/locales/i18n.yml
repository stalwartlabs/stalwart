calendar.alarm_footer:
  en-US: You are receiving this email because you have enabled calendar notifications. To stop receiving these emails, login to the self-service portal and disable event notifications.
  es-ES: Recibes este correo porque has habilitado las notificaciones de calendario. Para dejar de recibir estos correos, inicia sesión en el portal de autoservicio y desactiva las notificaciones de eventos.
  fr-FR: Vous recevez cet e-mail car vous avez activé les notifications de calendrier. Pour arrêter de recevoir ces e-mails, connectez-vous au portail libre-service et désactivez les notifications d'événements.
  de-DE: Sie erhalten diese E-Mail, weil Sie Kalender-Benachrichtigungen aktiviert haben. Um diese E-Mails nicht mehr zu erhalten, melden Sie sich im Self-Service-Portal an und deaktivieren Sie Ereignisbenachrichtigungen.
  it-IT: Ricevi questa email perché hai abilitato le notifiche del calendario. Per smettere di ricevere queste email, accedi al portale self-service e disabilita le notifiche degli eventi.
  pt-PT: Está a receber este e-mail porque ativou as notificações do calendário. Para deixar de receber estes e-mails, inicie sessão no portal de autosserviço e desative as notificações de eventos.
  nl-NL: U ontvangt deze e-mail omdat u kalendernotificaties heeft ingeschakeld. Om deze e-mails niet meer te ontvangen, logt u in op de selfservice-portal en schakelt u gebeurtenismeldingen uit.
  da-DK: Du modtager denne e-mail, fordi du har aktiveret kalendernotifikationer. Du kan deaktivere notifikationer i selvbetjeningsportalen.
  ca-ES: Estàs rebent aquest correu perquè tens habilitades les notificacions del calendari. Per no rebre més aquests correus, identifica't al portal d'autoservei i desactiva les notificacions d'esdeveniments.
  el-GR: Λαμβάνετε αυτό το e-mail γιατί έχετε ενεργοποιήσει τις ειδοποιήσεις ημερολογίου. Για διακοπή της λήψης τους, μπείτε στην πύλη αυτοεξυπηρέτησης και απενεργοποιήστε τις ειδοποιήσεις εκδηλώσεων.
  sv-SE: Du får det här mejlet eftersom du har slagit på kalendernotifikationer. Logga in i självbetjäningsportalen och stäng av händelsenotifikationer om du inte vill få fler.
  pl-PL: Otrzymujesz tę wiadomość, ponieważ włączyłeś powiadomienia kalendarza. Aby przestać je otrzymywać, zaloguj się do portalu samoobsługowego i wyłącz powiadomienia o wydarzeniach.
  pt-BR: Você está recebendo este e-mail porque ativou as notificações do calendário. Para parar de receber estes e-mails, faça login no portal de autoatendimento e desative as notificações de eventos.
  ru-RU: Вы получаете это письмо, потому что включили уведомления календаря. Чтобы больше не получать такие письма, войдите в портал самообслуживания и отключите уведомления о событиях.
  uk-UA: Ви отримуєте цей лист, тому що увімкнули сповіщення календаря. Щоб більше не отримувати такі листи, увійдіть на портал самообслуговування та вимкніть сповіщення про події.
  bg-BG: Получавате този имейл, защото сте включили известията от календара. За да спрете да ги получавате, влезте в портала за самообслужване и изключете известията за събития.
  cs-CZ: Tento e-mail dostáváte, protože jste zapnuli oznámení kalendáře. Pokud je již nechcete dostávat, přihlaste se do samoobslužného portálu a vypněte oznámení o událostech.
  sk-SK: Tento e-mail dostávate, pretože ste zapli oznámenia kalendára. Ak ich už nechcete dostávať, prihláste sa do samoobslužného portálu a vypnite oznámenia o udalostiach.
  sl-SI: To e-pošto prejemate, ker ste vklopili obvestila koledarja. Če jih ne želite več prejemati, se prijavite v samopostrežni portal in izklopite obvestila o dogodkih.
  hr-HR: Ovu e-poštu primate jer ste uključili obavijesti kalendara. Ako ih više ne želite primati, prijavite se na samoposlužni portal i isključite obavijesti o događajima.
  lt-LT: Šį el. laišką gaunate, nes įjungėte kalendoriaus pranešimus. Jei nebenorite jų gauti, prisijunkite prie savitarnos portalo ir išjunkite pranešimus apie įvykius.
  hu-HU: Azért kapja ezt az e-mailt, mert bekapcsolta a naptárértesítéseket. Ha nem szeretne több ilyen e-mailt kapni, jelentkezzen be az önkiszolgáló portálra, és kapcsolja ki az eseményértesítéseket.
  ro-RO: Primiți acest e-mail deoarece ați activat notificările de calendar. Pentru a nu le mai primi, conectați-vă la portalul de autoservire și dezactivați notificările despre evenimente.
  fi-FI: Saat tämän sähköpostin, koska olet ottanut kalenteri-ilmoitukset käyttöön. Jos et halua enää saada näitä viestejä, kirjaudu itsepalveluportaaliin ja poista tapahtumailmoitukset käytöstä.
  nb-NO: Du mottar denne e-posten fordi du har slått på kalendervarsler. Logg inn på selvbetjeningsportalen og slå av hendelsesvarsler hvis du ikke vil motta flere.
  tr-TR: Takvim bildirimlerini açtığınız için bu e-postayı alıyorsunuz. Bu e-postaları almayı durdurmak için self servis portalında oturum açın ve etkinlik bildirimlerini kapatın.
  zh-CN: 您收到此邮件是因为您启用了日历通知。如需停止接收此类邮件，请登录自助服务门户并关闭活动通知。
  zh-TW: 您收到這封郵件是因為您已啟用行事曆通知。若要停止接收這類郵件，請登入自助服務入口網站並關閉活動通知。
  ja-JP: カレンダー通知を有効にしているため、このメールが送信されています。今後このメールを受け取らないようにするには、セルフサービスポータルにログインして予定の通知を無効にしてください。
  ko-KR: 캘린더 알림을 사용 설정했기 때문에 이 이메일을 받고 있습니다. 더 이상 받지 않으려면 셀프 서비스 포털에 로그인하여 일정 알림을 사용 중지하세요.
  th-TH: คุณได้รับอีเมลนี้เพราะคุณเปิดการแจ้งเตือนปฏิทินไว้ หากไม่ต้องการรับอีเมลเหล่านี้อีก โปรดเข้าสู่ระบบพอร์ทัลบริการตนเองและปิดการแจ้งเตือนกิจกรรม
  vi-VN: Bạn nhận được email này vì bạn đã bật thông báo lịch. Để ngừng nhận những email này, hãy đăng nhập vào cổng tự phục vụ và tắt thông báo sự kiện.
  id-ID: Anda menerima email ini karena Anda mengaktifkan notifikasi kalender. Untuk berhenti menerima email ini, masuk ke portal layanan mandiri dan nonaktifkan notifikasi acara.
  hi-IN: आपको यह ईमेल इसलिए मिल रहा है क्योंकि आपने कैलेंडर सूचनाएँ चालू की हैं। ये ईमेल पाना बंद करने के लिए, सेल्फ-सर्विस पोर्टल में साइन इन करें और इवेंट सूचनाएँ बंद करें।
  ar-SA: تتلقى هذه الرسالة لأنك فعّلت إشعارات التقويم. لإيقاف تلقي هذه الرسائل، سجّل الدخول إلى بوابة الخدمة الذاتية وعطّل إشعارات الأحداث.
  he-IL: קיבלת הודעה זו כי הפעלת התראות יומן. כדי להפסיק לקבל הודעות אלה, יש להיכנס לפורטל השירות העצמי ולכבות את התראות האירועים.
  fa-IR: این ایمیل را دریافت می‌کنید چون اعلان‌های تقویم را فعال کرده‌اید. برای توقف دریافت این ایمیل‌ها، به درگاه خودخدمت وارد شوید و اعلان‌های رویداد را غیرفعال کنید.

