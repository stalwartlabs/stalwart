[package]
name = "zstd-builder"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
common = { path = "../../crates/common" }
email = { path = "../../crates/email" }
groupware = { path = "../../crates/groupware" }
jmap_proto = { path = "../../crates/jmap-proto" }
nlp = { path = "../../crates/nlp" }
smtp = { path = "../../crates/smtp" }
store = { path = "../../crates/store", features = ["test_mode"] }
types = { path = "../../crates/types" }
utils = { path = "../../crates/utils" }
calcard = { version = "0.3", features = ["rkyv"] }
mail-builder = { version = "0.5" }
mail-parser = { version = "0.11", features = ["full_encoding"] }
rkyv = { version = "0.8.17", features = ["little_endian", "unaligned"] }
serde_json = "1.0"
sieve-rs = { version = "1.0" }
smtp-proto = { version = "0.2.3", features = ["rkyv"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zstd = { version = "0.13", features = ["zdict_builder", "experimental"] }

[patch.crates-io]
sieve-rs = { path = "../../../sieve" }

[profile.release]
opt-level = 2
debug = false
