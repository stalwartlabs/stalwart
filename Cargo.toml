[workspace]
resolver = "2"
members = [
    "crates/main",
    "crates/types",
    "crates/http",
    "crates/http-proto",
    "crates/jmap",
    "crates/jmap-proto",
    "crates/email",
    "crates/imap",
    "crates/imap-proto",
    "crates/smtp",
    "crates/managesieve",
    "crates/pop3",
    "crates/dav-proto",
    "crates/scim-proto",
    "crates/scim",
    "crates/dav",
    "crates/groupware",
    "crates/spam-filter",
    "crates/nlp",
    "crates/store",
    "crates/coordinator",
    "crates/directory",
    "crates/registry",
    "crates/services",
    "crates/utils",
    "crates/common",
    "crates/trc",
    "crates/telemetry",
    "crates/text-extract",
    "crates/smtp-proto",
    "crates/smtp-report",
    "crates/calcard",
    "crates/sieve",
    "crates/jmap-tools",
    "crates/s3",
]
default-members = [
    "crates/main",
    "crates/types",
    "crates/http",
    "crates/http-proto",
    "crates/jmap",
    "crates/jmap-proto",
    "crates/email",
    "crates/imap",
    "crates/imap-proto",
    "crates/smtp",
    "crates/managesieve",
    "crates/pop3",
    "crates/dav-proto",
    "crates/scim-proto",
    "crates/scim",
    "crates/dav",
    "crates/groupware",
    "crates/spam-filter",
    "crates/nlp",
    "crates/store",
    "crates/coordinator",
    "crates/directory",
    "crates/registry",
    "crates/services",
    "crates/utils",
    "crates/common",
    "crates/trc",
    "crates/telemetry",
    "crates/text-extract",
    "crates/smtp-proto",
    "crates/smtp-report",
    "crates/calcard",
    "crates/sieve",
    "crates/jmap-tools",
]

[workspace.dependencies]
rkyv = { version = "0.8.18", features = ["little_endian", "unaligned"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(stalwart_tests)'] }

[workspace.lints.clippy]
result_unit_err = "allow"

[profile.dev]
opt-level = 0
debug = 1
#codegen-units = 4
lto = false
incremental = true
panic = 'unwind'
debug-assertions = true
overflow-checks = false
rpath = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = true
incremental = false
panic = 'unwind'
debug-assertions = false
overflow-checks = false
rpath = false
strip = true

[profile.test]
opt-level = 0
debug = 1
#codegen-units = 16
lto = false
incremental = true
debug-assertions = true
overflow-checks = true
rpath = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = true
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[patch.crates-io]
hickory-proto = { git = "https://github.com/stalwartlabs/hickory-dns", branch = "stalwart/0.26" }
hickory-net = { git = "https://github.com/stalwartlabs/hickory-dns", branch = "stalwart/0.26" }
hickory-resolver = { git = "https://github.com/stalwartlabs/hickory-dns", branch = "stalwart/0.26" }
librocksdb-sys = { git = "https://github.com/stalwartlabs/rust-rocksdb", branch = "stalwart/0.25" }
